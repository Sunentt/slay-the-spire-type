<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Шпиль Теней — карточный рогалик</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-left">
      <span id="hud-char" class="hud-char"></span>
      <span id="hud-hp" class="hud-hp"></span>
      <span id="hud-gold" class="hud-gold"></span>
    </div>
    <div class="hud-center" id="hud-act"></div>
    <div class="hud-right">
      <button id="btn-relics" class="icon-btn" title="Реликвии">🏺</button>
      <button id="btn-deck" class="icon-btn" title="Колода">🃏</button>
      <button id="btn-menu" class="icon-btn" title="Меню">☰</button>
    </div>
  </header>

  <main id="views">
    <section id="view-menu"   class="view active"></section>
    <section id="view-char"   class="view"></section>
    <section id="view-map"    class="view"></section>
    <section id="view-combat" class="view"></section>
    <section id="view-reward" class="view"></section>
    <section id="view-rest"   class="view"></section>
    <section id="view-shop"   class="view"></section>
    <section id="view-end"    class="view"></section>
  </main>

  <div id="overlay" class="overlay hidden"></div>
  <div id="toast" class="toast hidden"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
